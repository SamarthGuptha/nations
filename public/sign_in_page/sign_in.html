<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sign_in.css">
    <script src="sign_in.js" defer></script>
    <title>Join/Create Game</title>
    <link rel="icon" type="image/x-icon" href="logo.jpeg">
</head>
<body>
    <!-- Hello, welcome to Nations! Please sign in to join or create a game. -->
    <div class="container_1">
        <br>        
        <h1 class="container_1_h">Join/Create Game</h1>
        <div class="dual_content">
            <div class="signup">
                <h1 style="text-align: center; self-align: center;">Create Game</h1>
                <input type="text" placeholder="Enter Name" class="name_2">
                <button class="thing_rom">Create Game</button>
            </div>
            <div class="line"></div>
            <div class="login">
                <h1 style="text-align: center; self-align: center;">Join Game</h1>
                <input type="text" placeholder="Enter Name" class="name">
                <input type="text" placeholder="Enter Game Code" class="game_code">
                <button class="join_game">Join Game</button>
            </div>
        </div>


    </div>





</body>
</html>
