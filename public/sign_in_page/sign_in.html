<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nations — Join or Create</title>
            <link rel="stylesheet" href="sign_in.css">
        <script src="sign_in.js" defer type="module"></script>
        <title>Nations - Join/Create</title>
        <link rel="icon" type="image/x-icon" href="logo.jpeg">

</head>
<body>
 <div class="container_1">
            <h1 class="container_1_h">Nations</h1>
            
            <div class="dual_content">
                <div class="signup">
                    <h2>Create Game</h2>
                    <input type="text" placeholder="Enter Name" class="name_2 input-field" id="createName" placeholder="Your NAME AND FAME">
                    <button class="thing_rom action-btn" id="create">Create Game</button>
                </div>
                
                <div class="line"></div>
                
                <div class="login">
                    <h2>Join Game</h2>
                    <input type="text" placeholder="Enter Name" class="name input-field" id="joinName" placeholder="Your name">
                    <input type="text" placeholder="Enter Game Code" class="game_code input-field" id="gameCode" inputmode="numeric" placeholder="Game code">
                    <button class="join_game action-btn" id="join" >Join Game</button>
                    <p id="error" class="error"></p>
                </div>
                
            </div>
        </div>










</body>
</html>
