<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="sign_in.css">
    <script src="sign_in.js" defer type="module"></script>
    <title>Nations - Join/Create</title>
    <link rel="icon" type="image/x-icon" href="logo.jpeg">
</head>
<body>
    
    <div class="container_1">
        <h1 class="container_1_h">Nations</h1>
        
        <div class="dual_content">
            <div class="signup">
                <h2>Create Game</h2>
                <input type="text" placeholder="Enter Name" class="name_2 input-field">
                <button class="thing_rom action-btn">Create Game</button>
            </div>
            
            <div class="line"></div>
            
            <div class="login">
                <h2>Join Game</h2>
                <input type="text" placeholder="Enter Name" class="name input-field">
                <input type="text" placeholder="Enter Game Code" class="game_code input-field">
                <button class="join_game action-btn">Join Game</button>
            </div>
            
        </div>
    </div>

</body>
</html>
